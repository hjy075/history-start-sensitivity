name: tmp-uci-audit
on:
  push:
    branches: [tmp-entsoe-audit]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pandas numpy pyarrow requests lightgbm scikit-learn
      - run: python tmp_uci_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uci-audit-results
          path: uci_audit_results.csv
