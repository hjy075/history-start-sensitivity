name: tmp-walmart-probe
on:
  push:
    branches: [tmp-entsoe-audit]
    paths:
      - 'tmp_walmart_probe.py'
      - '.github/workflows/tmp-walmart-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pandas numpy pyarrow requests
      - run: python tmp_walmart_probe.py
