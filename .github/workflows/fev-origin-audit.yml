name: FEV origin audit

on:
  push:
    branches:
      - tmp/fev-origin-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn datasets pyarrow huggingface_hub
      - name: Run corrected exact-FEV GFC14 robustness audit
        run: |
          python experiments/fev_origin_audit_v2.py | tee fev_origin_audit_v2.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fev-origin-audit-v2-results
          path: |
            tmp_fev_audit_results_v2/
            fev_origin_audit_v2.log
          if-no-files-found: warn
